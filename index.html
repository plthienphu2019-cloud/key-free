<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Key</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
}
.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
}
.date-header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}
.date-main {
    font-size: 32px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 5px;
}
.date-sub {
    font-size: 14px;
    opacity: 0.7;
    letter-spacing: 1px;
}
h1 {
    font-size: 24px;
    margin-bottom: 10px;
    text-align: center;
}
.subtitle {
    text-align: center;
    opacity: 0.8;
    margin-bottom: 25px;
    font-size: 13px;
}
.key-box {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    text-align: center;
    border: 2px dashed rgba(255,255,255,0.3);
}
.key-value {
    font-family: 'Courier New', monospace;
    font-size: 28px;
    font-weight: bold;
    word-break: break-all;
    color: #ffd700;
    letter-spacing: 3px;
    margin: 15px 0;
}
.key-type {
    font-size: 11px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 2px;
}
.timer {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
    text-align: center;
}
.timer-label {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 5px;
    letter-spacing: 1px;
}
.timer-value {
    font-size: 22px;
    font-weight: bold;
    color: #00ff88;
    font-family: 'Courier New', monospace;
}
.timer-value.expired {
    color: #ff4757;
}
.timer-note {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 5px;
}
.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
    background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
    color: #333;
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,215,0,0.4);
}
.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}
.btn-copy {
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 13px;
    padding: 10px;
}
.status {
    text-align: center;
    font-size: 12px;
    opacity: 0.8;
    margin-top: 15px;
    min-height: 18px;
}
.status.success { color: #00ff88; opacity: 1; }
.status.error { color: #ff4757; opacity: 1; }
.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    opacity: 0.5;
}
</style>
</head>
<body>
<div class="container">

    <div class="date-header">
        <div class="date-main" id="todayDate">--/--/----</div>
        <div class="date-sub" id="todayDay">Đang tải...</div>
    </div>

    <h1>🎁 WEB KEY</h1>
    <p class="subtitle">Lấy key free 24h — mỗi ngày 1 key</p>

    <button class="btn" id="getKeyBtn">🔑 LẤY KEY FREE</button>

    <div id="keyDisplay" style="display:none;">
        <div class="key-box">
            <div class="key-type">KEY FREE</div>
            <div class="key-value" id="keyValue">---</div>
        </div>

        <div class="timer">
            <div class="timer-label">⏰ KEY CÒN HIỆU LỰC</div>
            <div class="timer-value" id="timerValue">--:--:--</div>
            <div class="timer-note" id="timerNote"></div>
        </div>

        <button class="btn btn-copy" id="copyBtn">📋 COPY KEY</button>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">Key có hiệu lực 24 giờ kể từ lúc lấy</div>
</div>

<script>
// ============================================
// CẤU HÌNH
// ============================================
const KEY_DURATION = 24 * 3600 * 1000;  // 24 giờ
const STORAGE_KEY = "tphudz_free_key";

// ============================================
// NGÀY THÁNG
// ============================================
const DAYS = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

function updateDate() {
    const now = new Date();
    const d = String(now.getDate()).padStart(2, "0");
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const y = now.getFullYear();
    const dayName = DAYS[now.getDay()];

    document.getElementById("todayDate").textContent = `${d}/${m}/${y}`;
    document.getElementById("todayDay").textContent = dayName;
    document.title = `Web Key ${d}/${m}/${y}`;
}

setInterval(updateDate, 1000);
updateDate();

// ============================================
// SINH KEY: 3 SỐ + 5 CHỮ
// ============================================
function genKey() {
    let digits = "";
    for (let i = 0; i < 3; i++) {
        digits += Math.floor(Math.random() * 10);
    }
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let letters = "";
    for (let i = 0; i < 5; i++) {
        letters += chars[Math.floor(Math.random() * chars.length)];
    }
    return digits + letters;
}

// ============================================
// LƯU / ĐỌC
// ============================================
function saveKey(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadKey() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);

        // Nếu còn hạn → trả về
        if (data.expires > Date.now()) return data;

        // Hết hạn → xoá
        localStorage.removeItem(STORAGE_KEY);
    } catch(e) {}
    return null;
}

// ============================================
// UI
// ============================================
let currentKey = null;
let timerInterval = null;

function formatTime(ms) {
    if (ms <= 0) return "HẾT HẠN";
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function formatDateTime(ts) {
    const d = new Date(ts);
    const day = String(d.getDate()).padStart(2, "0");
    const mon = String(d.getMonth() + 1).padStart(2, "0");
    const h = String(d.getHours()).padStart(2, "0");
    const m = String(d.getMinutes()).padStart(2, "0");
    return `${h}:${m} ${day}/${mon}`;
}

function updateTimer() {
    if (!currentKey) return;
    const remaining = currentKey.expires - Date.now();
    const timerEl = document.getElementById("timerValue");
    const noteEl = document.getElementById("timerNote");

    if (remaining <= 0) {
        timerEl.textContent = "HẾT HẠN";
        timerEl.classList.add("expired");
        noteEl.textContent = "Bạn có thể lấy key mới";
        clearInterval(timerInterval);

        // Bật lại nút
        const btn = document.getElementById("getKeyBtn");
        btn.disabled = false;
        btn.textContent = "🔑 LẤY KEY MỚI";

        showStatus("⏰ Key đã hết hạn. Lấy key mới!", "error");
    } else {
        timerEl.textContent = formatTime(remaining);
        timerEl.classList.remove("expired");
        noteEl.textContent = `Hết hạn lúc ${formatDateTime(currentKey.expires)}`;
    }
}

function showKey(data) {
    currentKey = data;
    document.getElementById("keyDisplay").style.display = "block";
    document.getElementById("keyValue").textContent = data.key;

    if (timerInterval) clearInterval(timerInterval);
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
}

function showStatus(msg, type = "") {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = "status " + type;
}

// ============================================
// LẤY KEY
// ============================================
document.getElementById("getKeyBtn").addEventListener("click", () => {
    const existing = loadKey();
    if (existing) {
        showStatus("⚠️ Bạn đang có key còn hiệu lực!", "error");
        showKey(existing);
        return;
    }

    const key = genKey();
    const data = {
        key: key,
        created: Date.now(),
        expires: Date.now() + KEY_DURATION,   // 24 giờ từ lúc lấy
    };

    saveKey(data);
    showKey(data);
    showStatus("✅ Đã lấy key thành công! Có hiệu lực 24h.", "success");
});

// ============================================
// COPY
// ============================================
document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!currentKey) return;
    try {
        await navigator.clipboard.writeText(currentKey.key);
        showStatus("📋 Đã copy key!", "success");
    } catch(e) {
        const ta = document.createElement("textarea");
        ta.value = currentKey.key;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showStatus("📋 Đã copy key!", "success");
    }
});

// ============================================
// KHỞI ĐỘNG
// ============================================
(function init() {
    const existing = loadKey();
    if (existing) {
        showKey(existing);
        showStatus("👋 Chào mừng trở lại! Key còn hiệu lực.", "success");
    }
})();
</script>
</body>
</html>
